name: All Builds (Linux, macOS, Windows, Android, IPA, DEB, RPM, AppImage)

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]
  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-latest
          - target: macos
            runner: macos-latest
          - target: windows
            runner: windows-latest
          - target: aab
            runner: ubuntu-latest
          - target: apk
            runner: ubuntu-latest
          - target: ipa
            runner: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Android NDK with retries
        if: matrix.target == 'aab' || matrix.target == 'apk'
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          ndk_dir="$sdk_root/ndk/28.2.13676358"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "Android sdkmanager not found at $sdkmanager"
            exit 1
          fi

          "$sdkmanager" --sdk_root="$sdk_root" --licenses < <(yes 2>/dev/null)

          for attempt in 1 2 3; do
            echo "Installing NDK 28.2.13676358 (attempt $attempt/3)"
            if "$sdkmanager" --sdk_root="$sdk_root" --install "ndk;28.2.13676358"; then
              if [[ ! -f "$ndk_dir/source.properties" ]]; then
                echo "NDK installation reported success but $ndk_dir/source.properties is missing"
                exit 1
              fi
              exit 0
            fi
            "$sdkmanager" --sdk_root="$sdk_root" --uninstall "ndk;28.2.13676358" || true
            sleep 5
          done
          echo "Failed to install NDK 28.2.13676358 after 3 attempts"
          exit 1

      - name: Set build version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="2.1.1"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build Flet app
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: ${{ matrix.target }}
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}
          build-version: ${{ steps.version.outputs.value }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-build
          path: ${{ steps.build.outputs.archive-path }}
          if-no-files-found: error

  package-deb-rpm:
    name: Build DEB and RPM
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install package build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            alien build-essential debhelper dh-python dpkg-dev fakeroot python3-all \
            python3-pip python3-venv rpm rsync

      - name: Build DEB and RPM packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/packages
          mkdir -p dist/packages

          dpkg-buildpackage -us -uc -b
          deb_file="$(find .. -maxdepth 1 -type f -name 'localsend-pro_*.deb' -print -quit)"
          test -n "$deb_file"
          cp "$deb_file" dist/packages/

          alien --to-rpm "$deb_file"
          rpm_file="$(find . -maxdepth 1 -type f -name 'localsend-pro-*.rpm' -print -quit)"
          test -n "$rpm_file"
          cp "$rpm_file" dist/packages/

      - name: Upload DEB package
        uses: actions/upload-artifact@v4
        with:
          name: deb-build
          path: dist/packages/*.deb
          if-no-files-found: error

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: rpm-build
          path: dist/packages/*.rpm
          if-no-files-found: error

  package-appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set build version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="2.1.1"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            file libgtk-3-dev ninja-build wget \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good
          python -m pip install --upgrade pip
          python -m pip install flet-cli

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          app_id=localsend-pro
          app_name="LocalSend Pro"
          build_root=build/linux
          appdir=AppDir

          rm -rf "$build_root" "$appdir" dist/packages
          flet build linux --yes --no-rich-output --build-version="${{ steps.version.outputs.value }}"

          app_bin=""
          while IFS= read -r candidate; do
            if file -b "$candidate" | grep -q 'ELF.*executable'; then
              app_bin="$candidate"
              break
            fi
          done < <(find "$build_root" -type f -perm -111 ! -path '*/lib/*' \
            ! -name '*.so' ! -name '*.so.*')
          test -n "$app_bin"
          app_root="$(dirname "$app_bin")"
          app_bin_name="$(basename "$app_bin")"

          wget -q -O linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod 755 linuxdeploy-x86_64.AppImage

          install -d "$appdir/usr/bin" "$appdir/usr/share/icons/hicolor/256x256/apps"
          cp -a "$app_root"/. "$appdir/usr/bin/"
          if [[ "$app_bin_name" != "$app_id" ]]; then
            ln -s "$app_bin_name" "$appdir/usr/bin/$app_id"
          fi
          install -m 644 assets/icon.png "$appdir/usr/share/icons/hicolor/256x256/apps/$app_id.png"
          install -m 644 assets/icon.png "$appdir/$app_id.png"
          ln -s "$app_id.png" "$appdir/.DirIcon"

          cat > "$appdir/com.localsend.pro.desktop" <<EOF
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=$app_name
          Comment=Securely share files and messages on your local network
          Exec=$app_id
          Icon=$app_id
          Terminal=false
          Categories=Network;FileTransfer;Utility;
          StartupNotify=true
          EOF

          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy-x86_64.AppImage --appdir "$appdir" \
            --desktop-file "$appdir/com.localsend.pro.desktop" --output appimage

          appimage_file="$(find . -maxdepth 1 -type f -name '*.AppImage' ! -name 'linuxdeploy-*.AppImage' -print -quit)"
          test -n "$appimage_file"
          install -d dist/packages
          cp "$appimage_file" dist/packages/

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage-build
          path: dist/packages/*.AppImage
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, package-deb-rpm, package-appimage]
    runs-on: ubuntu-latest
    steps:
      - name: Download build archives
        uses: actions/download-artifact@v4
        with:
          pattern: "*-build"
          path: release-assets
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          shopt -s nullglob
          files=(release-assets/*)
          if (( ${#files[@]} == 0 )); then
            echo "No build files were downloaded; refusing to publish an empty release"
            exit 1
          fi
          printf 'Release file: %s\n' "${files[@]}"

      - name: Create release and upload build files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LocalSend Pro ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*
