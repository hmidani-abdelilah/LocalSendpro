name: Build All Platforms (Linux, macOS, Windows, Android, iOS)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  BUILD_NUMBER: ${{ github.run_number }}
  BUILD_VERSION: 1.0.0
  PYTHON_VERSION: 3.12.2

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Build Linux
      uses: flet-dev/flet-build-action@v1
      with:
        target: linux
        runner-python-version: ${{ env.PYTHON_VERSION }}
        build-number: ${{ env.BUILD_NUMBER }}
        build-version: ${{ env.BUILD_VERSION }}
    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-build-artifact
        path: ${{ steps.build.outputs.archive-path }}
        if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Build macOS
      uses: flet-dev/flet-build-action@v1
      with:
        target: macos
        runner-python-version: ${{ env.PYTHON_VERSION }}
        build-number: ${{ env.BUILD_NUMBER }}
        build-version: ${{ env.BUILD_VERSION }}
    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-build-artifact
        path: ${{ steps.build.outputs.archive-path }}
        if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Build Windows
      uses: flet-dev/flet-build-action@v1
      with:
        target: windows
        runner-python-version: ${{ env.PYTHON_VERSION }}
        build-number: ${{ env.BUILD_NUMBER }}
        build-version: ${{ env.BUILD_VERSION }}
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-build-artifact
        path: ${{ steps.build.outputs.archive-path }}
        if-no-files-found: error

  build-aab:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Build AAB
      uses: flet-dev/flet-build-action@v1
      with:
        target: aab
        runner-python-version: ${{ env.PYTHON_VERSION }}
        build-number: ${{ env.BUILD_NUMBER }}
        build-version: ${{ env.BUILD_VERSION }}
    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aab-build-artifact
        path: ${{ steps.build.outputs.archive-path }}
        if-no-files-found: error

  build-apk:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Build APK
      uses: flet-dev/flet-build-action@v1
      with:
        target: apk
        runner-python-version: ${{ env.PYTHON_VERSION }}
        build-number: ${{ env.BUILD_NUMBER }}
        build-version: ${{ env.BUILD_VERSION }}
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: apk-build-artifact
        path: ${{ steps.build.outputs.archive-path }}
        if-no-files-found: error

  build-ipa:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Build IPA
      uses: flet-dev/flet-build-action@v1
      with:
        target: ipa
        runner-python-version: ${{ env.PYTHON_VERSION }}
        build-number: ${{ env.BUILD_NUMBER }}
        build-version: ${{ env.BUILD_VERSION }}
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ipa-build-artifact
        path: ${{ steps.build.outputs.archive-path }}
        if-no-files-found: error
